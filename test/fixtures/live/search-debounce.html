<!doctype html>
<html>
<head><meta charset="utf-8"><title>Search debounce fixture</title></head>
<body>
  <h1>Workflows</h1>
  <input id="search" aria-label="Search workflows" placeholder="Search this page...">
  <input id="note" aria-label="Note">
  <form action="/landed.html" method="get"><input aria-label="Go to" name="to"></form>
  <div id="rows"></div>
  <p id="status">idle</p>
  <script>
    // Query parameters:
    //   deb     debounce ms (300)
    //   lat     server latency ms of the search request (250)
    //   mode    timeout: clearTimeout + setTimeout; lodash: a debounce that waits again for its rest;
    //           interval: an RxJS-like setInterval debounce; direct: the request starts in the input event
    //   busy=1  the Note field sets aria-busy on the list for 400 ms, driven by animation frames
    //   poll=1  a poll request every 150 ms from load
    //   chain   named or arrow: the Note field starts a poll chain
    // The old rows stay on screen until the new ones arrive, with no loading marker.
    const q = new URLSearchParams(location.search);
    const deb = Number(q.get('deb') ?? 300), lat = Number(q.get('lat') ?? 250), mode = q.get('mode') ?? 'timeout';
    const ALL = ['Weekly metrics digest', 'Incident postmortem draft', 'Q3 roadmap review', 'Release notes writer', 'Sales call notes'];
    const rows = document.getElementById('rows'), status = document.getElementById('status');
    const render = (names) => {
      rows.innerHTML = '';
      for (const n of names) { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Open ' + n; rows.appendChild(b); }
    };
    render(ALL);
    const search = async (text) => {
      await (await fetch('/api/wait?ms=' + lat)).text();
      render(ALL.filter((n) => n.toLowerCase().includes(text.trim().toLowerCase())));
    };
    const input = document.getElementById('search');
    if (mode === 'timeout') {
      let t;
      input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => search(input.value), deb); });
    } else if (mode === 'lodash') {
      let timer, last = 0;
      const expired = () => {
        const rest = deb - (Date.now() - last);
        if (rest > 0) { timer = setTimeout(expired, rest); return; }
        timer = undefined;
        search(input.value);
      };
      const debounced = () => { last = Date.now(); if (!timer) timer = setTimeout(expired, deb); };
      // Two calls 100 ms apart: at the first expiry the debounce waits again for the rest.
      input.addEventListener('input', () => { debounced(); setTimeout(debounced, 100); });
    } else if (mode === 'interval') {
      let iv;
      input.addEventListener('input', () => { clearInterval(iv); iv = setInterval(() => { clearInterval(iv); search(input.value); }, deb); });
    } else if (mode === 'direct') {
      input.addEventListener('input', () => search(input.value));
    }
    const note = document.getElementById('note');
    if (q.get('busy') === '1') {
      note.addEventListener('input', () => {
        rows.setAttribute('aria-busy', 'true');
        const t0 = performance.now();
        const frame = () => { if (performance.now() - t0 < 400) requestAnimationFrame(frame); else { rows.removeAttribute('aria-busy'); status.textContent = 'saved'; } };
        requestAnimationFrame(frame);
      });
    }
    if (q.get('poll') === '1') {
      let n = 0;
      setInterval(async () => { await (await fetch('/api/wait?ms=20')).text(); status.textContent = 'polled ' + (++n); }, 150);
    }
    if (q.get('chain') === 'named') {
      let n = 0;
      function poll() { fetch('/api/wait?ms=20').then((r) => r.text()).then(() => { status.textContent = 'tick ' + (++n); setTimeout(poll, 800); }); }
      note.addEventListener('input', () => { setTimeout(poll, 800); }, { once: true });
    }
    if (q.get('chain') === 'arrow') {
      let n = 0;
      const tick = () => { status.textContent = 'tick ' + (++n); setTimeout(() => tick(), 300); };
      note.addEventListener('input', () => { setTimeout(() => tick(), 300); }, { once: true });
    }
  </script>
</body>
</html>
