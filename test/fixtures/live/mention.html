<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mention fixture</title>
<style>
  body { font: 14px sans-serif; margin: 16px; }
  .box { border: 1px solid #999; min-height: 40px; padding: 8px; width: 520px; margin-bottom: 8px; }
  .chip { background: #def; border-radius: 4px; padding: 0 4px; }
  [role="option"] { padding: 4px; cursor: pointer; }
  .ghost { pointer-events: none; width: 12px; height: 12px; }
  #popup { border: 1px solid #666; width: 300px; padding: 4px; margin: 8px 0; }
  #big { width: 200px; height: 40px; padding: 0; min-height: 0; }
  #big .chip { display: inline-block; width: 200px; height: 40px; padding: 0; }
</style>
</head>
<body>
<form id="chat">
  <div id="composer" class="box" contenteditable="true" role="textbox" aria-multiline="true" aria-placeholder="Type a message">Hi Ann <span contenteditable="false" data-mention-id="user-ann" data-mention-display="Ann Lee" class="chip">@Ann Lee</span>&nbsp;</div>
  <button type="button" id="send">Send message</button>
  <input type="submit" value="Post">
  <button type="button" role="checkbox" aria-checked="false" value="on"></button>
</form>
<div id="editor" class="box" contenteditable="true" aria-label="Doc">Intro <span contenteditable="false" data-slate-void="true"><img alt="" width="20" height="20" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></span> <span data-type="mention" data-label="Bob Roy" contenteditable="false" class="chip">@Bob Roy</span></div>
<div id="big" class="box" contenteditable="true" aria-label="Big chip"><span contenteditable="false" data-mention-id="x" data-mention-display="Big" class="chip">@Big</span></div>
<textarea id="notes" placeholder="Notes">default text</textarea>
<div role="dialog" id="popup" aria-label="Picker">
  <input role="combobox" aria-controls="list" aria-expanded="true" aria-label="Search people">
  <div role="listbox" id="list" aria-label="Suggestions">
    <div role="option" aria-selected="true" id="o1">Research Agent</div>
    <div role="option" aria-selected="false" id="o2"><button type="button" role="checkbox" aria-checked="true" value="on" class="ghost" tabindex="-1"></button><span>Ann Lee</span></div>
  </div>
  <button type="button">Done (1)</button>
</div>
<div role="listbox" aria-label="Plain list"><div role="option" aria-selected="true">Chosen</div></div>
<div role="listbox" aria-multiselectable="true" aria-label="Multi"><div role="option" aria-selected="true">Multi chosen</div></div>
<script>
  window.chipDowns = 0;
  for (const chip of document.querySelectorAll('.chip')) chip.addEventListener('mousedown', () => { window.chipDowns += 1; });
</script>
</body>
</html>
