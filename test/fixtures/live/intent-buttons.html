<!doctype html>
<meta charset="utf-8">
<title>Intent buttons</title>
<!-- Icon-only submit buttons that a form tells apart by their value (a Remix or React Router intent). -->
<form method="post" action="/landed.html">
  <textarea aria-label="Reply"></textarea>
  <button type="submit" name="intent" value="send"><svg width="12" height="12"><path d="M0 0L12 6L0 12z"/></svg></button>
  <button type="submit" name="intent" value="delete"><svg width="12" height="12"><path d="M0 0H12V12H0z"/></svg></button>
  <button type="button" role="checkbox" aria-checked="false" value="on"></button>
</form>
