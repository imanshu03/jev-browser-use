<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Demo Notes - Sign in</title></head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login">
      <label>Email <input name="email" type="email" autocomplete="username"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="error" role="alert"></p>
  </main>
  <script>
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      if (!f.get("email") || !f.get("password")) { document.getElementById("error").textContent = "Enter your email and password"; return; }
      localStorage.setItem("demo-user", String(f.get("email")));
      location.href = "/app.html";
    });
  </script>
</body>
</html>
