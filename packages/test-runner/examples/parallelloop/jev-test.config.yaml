# Parallelloop web app. Put TEST_EMAIL, TEST_PASSWORD, TYPESAFE_API_KEY and the LLM values (JEV_TEST_LLM_BASE_URL, JEV_TEST_LLM_API_KEY, JEV_TEST_LLM_MODEL) in .env next to this file.
environments:
  stage:
    base_url: https://app.staging.parallelloop.ai
  prod:
    base_url: https://app.parallelloop.ai
default_environment: stage

vars:
  org: ${ORGANIZATION_NAME:-Parallel Loop}

secrets: [TEST_PASSWORD]

flows:
  login:
    - goto: /login
    - fill: { field: Email, value: "${TEST_EMAIL}" }
    - fill: { field: Password, value: "${TEST_PASSWORD}" }
    - click: Sign in
    - expect: { url_matches: "^(?!.*/login)", timeout_ms: 20000 }

browser:
  headed: false
  workers: 2

jev:
  api_key: ${TYPESAFE_API_KEY}

# Any OpenAI-compatible endpoint. Leave JEV_TEST_LLM_BASE_URL empty for no LLM.
llm:
  base_url: ${JEV_TEST_LLM_BASE_URL}
  api_key: ${JEV_TEST_LLM_API_KEY}
  model: ${JEV_TEST_LLM_MODEL}

heal:
  local: warn
  ci: fail

timeouts:
  step_ms: 10000
  assert_ms: 15000
